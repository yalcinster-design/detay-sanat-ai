</div>

<script>


let grafikVerileri = [];


/* 
 * --------------------------------------------------
 * SONUÇLARI GETİR
 * --------------------------------------------------
 */

async function sonuclariGetir() {


    const kod =
        document
            .getElementById("ogrenciKodu")
            .value
            .trim()
            .toUpperCase();


    const mesaj =
        document.getElementById("mesaj");


    const sonuclar =
        document.getElementById("sonuclar");


    mesaj.innerText = "";

    sonuclar.style.display =
        "none";


    if (!kod) {

        mesaj.innerText =
            "Öğrenci kodunuzu giriniz.";

        return;
    }


    mesaj.innerText =
        "Sonuçlar getiriliyor...";


    try {


        const cevap =
            await fetch(
                "/ogrenci-sonuclari/" +
                encodeURIComponent(kod)
            );


        const veri =
            await cevap.json();


        if (!veri.basarili) {

            mesaj.innerText =
                veri.mesaj;

            return;
        }


        mesaj.innerText = "";


        /*
         * Sadece değerlendirilmiş
         * çalışmalar grafiğe girer.
         */

        grafikVerileri =
            veri.calismalar
                .filter(function(calisma) {

                    return (
                        calisma.durum ===
                        "Değerlendirildi"
                    );

                })
                .reverse();


        let html = `

            <div class="panel">

                <div class="ogrenciBilgi">

                    <h2>
                        ${veri.ogrenci.ad_soyad}
                    </h2>

                    <div>
                        Öğrenci Kodu:
                        <strong>
                            ${veri.ogrenci.ogrenci_kodu}
                        </strong>
                    </div>

                </div>

        `;


        /*
         * İSTATİSTİKLER
         */

        if (grafikVerileri.length > 0) {


            const puanlar =
                grafikVerileri.map(function(calisma) {

                    return calisma.toplam;

                });


            const toplam =
                puanlar.reduce(
                    function(a, b) {
                        return a + b;
                    },
                    0
                );


            const ortalama =
                Math.round(
                    toplam /
                    puanlar.length
                );


            const enYuksek =
                Math.max(...puanlar);


            const sonPuan =
                puanlar[
                    puanlar.length - 1
                ];


            html += `

                <div class="istatistikler">

                    <div class="istatistik">

                        <strong>
                            ${ortalama}
                        </strong>

                        Ortalama

                    </div>


                    <div class="istatistik">

                        <strong>
                            ${enYuksek}
                        </strong>

                        En Yüksek

                    </div>


                    <div class="istatistik">

                        <strong>
                            ${sonPuan}
                        </strong>

                        Son Puan

                    </div>

                </div>

            `;


            /*
             * GENEL GELİŞİM GRAFİĞİ
             */

            html += `

                <div class="grafikAlan">

                    <div class="grafikBaslik">
                        Genel Puan Gelişimi
                    </div>

                    <div class="grafikKutu">

                        <canvas
                            id="genelGrafik"
                            width="650"
                            height="300"
                        ></canvas>

                    </div>

                </div>

            `;


            /*
             * KRİTER GRAFİĞİ
             */

            html += `

                <div class="grafikAlan">

                    <div class="grafikBaslik">
                        Kriter Gelişimi
                    </div>

                    <div class="grafikKutu">

                        <canvas
                            id="kriterGrafik"
                            width="650"
                            height="300"
                        ></canvas>

                    </div>

                </div>

            `;

        }

        else {

            html += `

                <div class="uyari">

                    Henüz değerlendirilmiş
                    çalışmanız bulunmuyor.

                </div>

            `;

        }


        /*
         * ÇALIŞMALAR
         */

        if (veri.calismalar.length === 0) {

            html += `

                <p style="text-align:center;">
                    Henüz gönderilmiş bir çalışma bulunmuyor.
                </p>

            `;

        }


        veri.calismalar.forEach(function(calisma) {


            html += `

                <div class="calisma">

                    <h3>
                        ${calisma.calisma_turu}
                    </h3>

                    <p>
                        Tarih:
                        ${calisma.tarih}
                    </p>

            `;


            if (
                calisma.durum ===
                "Değerlendirildi"
            ) {


                html += `

                    <div class="puan">

                        <span>
                            Kompozisyon
                        </span>

                        <strong>
                            ${calisma.kompozisyon}/20
                        </strong>

                    </div>


                    <div class="puan">

                        <span>
                            Oran-Orantı
                        </span>

                        <strong>
                            ${calisma.oran_oranti}/20
                        </strong>

                    </div>


                    <div class="puan">

                        <span>
                            Perspektif
                        </span>

                        <strong>
                            ${calisma.perspektif}/20
                        </strong>

                    </div>


                    <div class="puan">

                        <span>
                            Işık-Gölge
                        </span>

                        <strong>
                            ${calisma.isik_golge}/20
                        </strong>

                    </div>


                    <div class="puan">

                        <span>
                            Çizgi Kullanımı
                        </span>

                        <strong>
                            ${calisma.cizgi_kullanimi}/20
                        </strong>

                    </div>


                    <div class="toplam">

                        Toplam:
                        ${calisma.toplam}/100

                    </div>

                `;


                if (calisma.yorum) {

                    html += `

                        <div class="yorum">

                            <strong>
                                Öğretmen Yorumu
                            </strong>

                            <br><br>

                            ${calisma.yorum}

                        </div>

                    `;

                }

            }

            else {

                html += `

                    <div class="bekliyor">

                        Çalışmanız henüz
                        değerlendirilmedi.

                    </div>

                `;

            }


            html += `

                </div>

            `;

        });


        html += `

            </div>

        `;


        sonuclar.innerHTML =
            html;


        sonuclar.style.display =
            "block";


        /*
         * Grafiklerin çizilmesi
         */

        if (grafikVerileri.length > 0) {

            setTimeout(function() {

                genelGrafikCiz();

                kriterGrafikCiz();

            }, 50);

        }


    }

    catch (hata) {

        mesaj.innerText =
            "Sunucuya bağlanırken bir hata oluştu.";

        console.error(hata);

    }

}


/*
 * --------------------------------------------------
 * GENEL PUAN GRAFİĞİ
 * --------------------------------------------------
 */

function genelGrafikCiz() {


    const canvas =
        document.getElementById(
            "genelGrafik"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext("2d");


    const width =
        canvas.width;


    const height =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const grafik = {

        sol: 45,

        sag: 20,

        ust: 20,

        alt: 45

    };


    const grafikWidth =
        width -
        grafik.sol -
        grafik.sag;


    const grafikHeight =
        height -
        grafik.ust -
        grafik.alt;


    /*
     * Y ekseni
     */

    ctx.strokeStyle =
        "#dddddd";


    ctx.fillStyle =
        "#555";


    ctx.font =
        "12px Arial";


    for (
        let puan = 0;
        puan <= 100;
        puan += 20
    ) {


        const y =
            height -
            grafik.alt -
            (
                puan / 100
            ) *
            grafikHeight;


        ctx.beginPath();


        ctx.moveTo(
            grafik.sol,
            y
        );


        ctx.lineTo(
            width -
            grafik.sag,
            y
        );


        ctx.stroke();


        ctx.fillText(
            puan,
            10,
            y + 4
        );

    }


    /*
     * Puan çizgisi
     */

    ctx.strokeStyle =
        "#222";


    ctx.lineWidth = 3;


    ctx.beginPath();


    grafikVerileri.forEach(
        function(calisma, index) {


            let x;


            if (
                grafikVerileri.length === 1
            ) {

                x =
                    grafik.sol +
                    grafikWidth / 2;

            }

            else {

                x =
                    grafik.sol +
                    (
                        index /
                        (
                            grafikVerileri.length - 1
                        )
                    ) *
                    grafikWidth;

            }


            const y =
                height -
                grafik.alt -
                (
                    calisma.toplam /
                    100
                ) *
                grafikHeight;


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.stroke();


    /*
     * Noktalar ve puanlar
     */

    grafikVerileri.forEach(
        function(calisma, index) {


            let x;


            if (
                grafikVerileri.length === 1
            ) {

                x =
                    grafik.sol +
                    grafikWidth / 2;

            }

            else {

                x =
                    grafik.sol +
                    (
                        index /
                        (
                            grafikVerileri.length - 1
                        )
                    ) *
                    grafikWidth;

            }


            const y =
                height -
                grafik.alt -
                (
                    calisma.toplam /
                    100
                ) *
                grafikHeight;


            ctx.fillStyle =
                "#222";


            ctx.beginPath();


            ctx.arc(
                x,
                y,
                5,
                0,
                Math.PI * 2
            );


            ctx.fill();


            ctx.fillStyle =
                "#222";


            ctx.font =
                "bold 12px Arial";


            ctx.fillText(
                calisma.toplam,
                x - 10,
                y - 10
            );


            ctx.fillStyle =
                "#555";


            ctx.font =
                "11px Arial";


            ctx.fillText(
                index + 1,
                x - 3,
                height - 20
            );

        }
    );


    ctx.fillStyle =
        "#555";


    ctx.font =
        "11px Arial";


    ctx.fillText(
        "Çalışma",
        width / 2 - 20,
        height - 5
    );

}


/*
 * --------------------------------------------------
 * KRİTER GELİŞİM GRAFİĞİ
 * --------------------------------------------------
 */

function kriterGrafikCiz() {


    const canvas =
        document.getElementById(
            "kriterGrafik"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext("2d");


    const width =
        canvas.width;


    const height =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const sol = 45;
    const sag = 20;
    const ust = 20;
    const alt = 45;


    const grafikWidth =
        width -
        sol -
        sag;


    const grafikHeight =
        height -
        ust -
        alt;


    /*
     * Y ekseni
     */

    ctx.strokeStyle =
        "#dddddd";


    ctx.fillStyle =
        "#555";


    ctx.font =
        "12px Arial";


    for (
        let puan = 0;
        puan <= 20;
        puan += 5
    ) {


        const y =
            height -
            alt -
            (
                puan / 20
            ) *
            grafikHeight;


        ctx.beginPath();


        ctx.moveTo(
            sol,
            y
        );


        ctx.lineTo(
            width - sag,
            y
        );


        ctx.stroke();


        ctx.fillText(
            puan,
            15,
            y + 4
        );

    }


    /*
     * Her kriteri ayrı çiziyoruz
     */

    const kriterler = [

        "kompozisyon",
        "oran_oranti",
        "perspektif",
        "isik_golge",
        "cizgi_kullanimi"

    ];


    kriterler.forEach(
        function(kriter, kriterIndex) {


            ctx.strokeStyle =
                "#222";


            ctx.lineWidth = 2;


            ctx.beginPath();


            grafikVerileri.forEach(
                function(calisma, index) {


                    let x;


                    if (
                        grafikVerileri.length === 1
                    ) {

                        x =
                            sol +
                            grafikWidth / 2;

                    }

                    else {

                        x =
                            sol +
                            (
                                index /
                                (
                                    grafikVerileri.length - 1
                                )
                            ) *
                            grafikWidth;

                    }


                    const puan =
                        calisma[kriter] || 0;


                    const y =
                        height -
                        alt -
                        (
                            puan / 20
                        ) *
                        grafikHeight;


                    if (index === 0) {

                        ctx.moveTo(
                            x,
                            y
                        );

                    }

                    else {

                        ctx.lineTo(
                            x,
                            y
                        );

                    }

                }
            );


            ctx.stroke();

        }
    );


    /*
     * Alt açıklama
     */

    ctx.fillStyle =
        "#555";


    ctx.font =
        "11px Arial";


    ctx.fillText(
        "K = Kompozisyon",
        50,
        height - 30
    );


    ctx.fillText(
        "O = Oran-Orantı",
        180,
        height - 30
    );


    ctx.fillText(
        "P = Perspektif",
        310,
        height - 30
    );


    ctx.fillText(
        "I = Işık-Gölge",
        420,
        height - 30
    );


    ctx.fillText(
        "Ç = Çizgi",
        530,
        height - 30
    );

}


/*
 * --------------------------------------------------
 * URL'DEN ÖĞRENCİ KODUNU OTOMATİK AL
 * --------------------------------------------------
 */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const urlKodu =
    urlParams.get("kod");


if (urlKodu) {

    document.getElementById(
        "ogrenciKodu"
    ).value =
        urlKodu.toUpperCase();


    sonuclariGetir();

}


</script>
