<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detay Sanat Akademi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

/* ANA KAPSAYICI */

.container {
    width: 92%;
    max-width: 500px;
    margin: 0 auto;
    padding: 32px 0 25px;
}

/* LOGO ALANI */

.logo {
    text-align: center;
    margin-bottom: 32px;
}

.logo img {
    width: 150px;
    max-width: 55%;
    height: auto;
    display: block;
    margin: 0 auto 18px;
}

.logo h1 {
    margin: 0;
    font-size: 25px;
    letter-spacing: 1px;
    font-weight: 700;
}

.logo p {
    margin: 9px 0 0;
    color: #666;
    font-size: 14px;
}

/* MENÜ */

.menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.menu a {
    display: block;
    text-decoration: none;
    background: white;
    color: #222;
    padding: 19px 20px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
}

.menu a:active {
    transform: scale(0.98);
}

.menu a:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(0,0,0,0.12);
}

.menu-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.menu-text {
    color: #666;
    font-size: 14px;
    line-height: 1.4;
}

/* SOL RENK ÇİZGİLERİ */

.cizim {
    border-left: 5px solid #222;
}

.sonuc {
    border-left: 5px solid #555;
}

.yonetici {
    border-left: 5px solid #777;
}

/* ALT YAZI */

.footer {
    text-align: center;
    margin-top: 30px;
    color: #999;
    font-size: 12px;
}

/* TELEFON */

@media (max-width: 400px) {

    .container {
        width: 90%;
        padding-top: 25px;
    }

    .logo {
        margin-bottom: 27px;
    }

    .logo img {
        width: 125px;
    }

    .logo h1 {
        font-size: 21px;
    }

    .logo p {
        font-size: 13px;
    }

    .menu a {
        padding: 17px 18px;
    }

    .menu-title {
        font-size: 17px;
    }

    .menu-text {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="/static/logo.png"
            alt="Detay Sanat Akademi"
        >

        <h1>
            DETAY SANAT AKADEMİ
        </h1>

        <p>
            Öğrenci ve yönetici paneli
        </p>

    </div>


    <!-- ANA MENÜ -->

    <div class="menu">


        <!-- ÇİZİM GÖNDER -->

        <a
            href="/gonder"
            class="cizim"
        >

            <div class="menu-title">
                🎨 Çizim Gönder
            </div>

            <div class="menu-text">
                Çalışmanızı sisteme gönderin.
            </div>

        </a>


        <!-- ÖĞRENCİ SONUÇLARI -->

        <a
            href="/sonuclar"
            class="sonuc"
        >

            <div class="menu-title">
                📊 Öğrenci Sonuçları
            </div>

            <div class="menu-text">
                Değerlendirme sonuçlarınızı görüntüleyin.
            </div>

        </a>


        <!-- YÖNETİCİ GİRİŞİ -->

        <a
            href="/yonetici-giris"
            class="yonetici"
        >

            <div class="menu-title">
                🔐 Yönetici Girişi
            </div>

            <div class="menu-text">
                Öğrenci kayıtları ve değerlendirme paneli.
            </div>

        </a>


    </div>


    <!-- ALT -->

    <div class="footer">

        Detay Sanat Akademi

    </div>


</div>


</body>

</html>
