```html
<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detay Sanat Akademi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    width: 92%;
    max-width: 500px;
    margin: 0 auto;
    padding: 30px 0;
}

.logo {
    text-align: center;
    margin-bottom: 35px;
}

.logo h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 1px;
}

.logo p {
    margin-top: 10px;
    color: #666;
    font-size: 15px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.menu a {
    display: block;
    text-decoration: none;
    background: white;
    color: #222;
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.menu a:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(0,0,0,0.12);
}

.menu-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 6px;
}

.menu-text {
    color: #666;
    font-size: 14px;
}

.cizim {
    border-left: 5px solid #222;
}

.sonuc {
    border-left: 5px solid #555;
}

.yonetici {
    border-left: 5px solid #777;
}

.footer {
    text-align: center;
    margin-top: 35px;
    color: #999;
    font-size: 13px;
}

</style>

</head>


<body>


<div class="container">


    <div class="logo">

        <h1>
            DETAY SANAT AKADEMİ
        </h1>

        <p>
            Öğrenci ve yönetici paneli
        </p>

    </div>


    <div class="menu">


        <!-- ÇİZİM GÖNDER -->

        <a
            href="/gonder"
            class="cizim"
        >

            <div class="menu-title">
                🎨 Çizim Gönder
            </div>

            <div class="menu-text">
                Çalışmanızı sisteme gönderin.
            </div>

        </a>


        <!-- ÖĞRENCİ SONUÇLARI -->

        <a
            href="/sonuclar"
            class="sonuc"
        >

            <div class="menu-title">
                📊 Öğrenci Sonuçları
            </div>

            <div class="menu-text">
                Değerlendirme sonuçlarınızı görüntüleyin.
            </div>

        </a>


        <!-- YÖNETİCİ GİRİŞİ -->

        <a
            href="/yonetici-giris"
            class="yonetici"
        >

            <div class="menu-title">
                🔐 Yönetici Girişi
            </div>

            <div class="menu-text">
                Öğrenci kayıtları ve değerlendirme paneli.
            </div>

        </a>


    </div>


    <div class="footer">
        Detay Sanat Akademi
    </div>


</div>


</body>

</html>
